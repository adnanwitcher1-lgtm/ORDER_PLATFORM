{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify | Order Platform</title>
    <script>
        (function () {
            var theme = "light";
            try {
                var saved = localStorage.getItem("theme");
                if (saved === "dark" || saved === "light") { theme = saved; }
                else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) { theme = "dark"; }
            } catch (e) {}
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body">
    <button type="button" class="theme-toggle floating" id="themeToggle" aria-label="Switch between light and dark theme" title="Switch theme">
        <span class="icon-moon">&#127769;</span><span class="icon-sun">&#9728;&#65039;</span>
    </button>
    <div class="login-card">
        <div class="login-brand">
            <span class="brand-icon big">&#128274;</span>
            <h2>Two-step verification</h2>
            <p>Enter the 6-digit code from your authenticator app, or a recovery code.</p>
        </div>
        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        <form method="post" novalidate autocomplete="off">
            {% csrf_token %}
            <div class="form-group">
                <label for="code">Code</label>
                <input type="text" id="code" name="code" class="input code-input" inputmode="text" autocomplete="one-time-code" maxlength="12" placeholder="123456" autofocus {% if locked %}disabled{% endif %}>
            </div>
            <button type="submit" class="btn btn-primary btn-block" {% if locked %}disabled{% endif %}>Verify</button>
        </form>
        <p class="login-back"><a href="{% url 'accounts:login' %}" class="link">&larr; Back to sign in</a></p>
    </div>
    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
